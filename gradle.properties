# Mengaktifkan AndroidX (wajib untuk Jetpack Compose)
android.useAndroidX=true

# Peruntukan memori JVM & pengekodan UTF-8 untuk binaan Kotlin + R8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Gaya kod rasmi Kotlin
kotlin.code.style=official

# Mengoptimumkan binaan Android Gradle Plugin
android.nonTransitiveRClass=true
