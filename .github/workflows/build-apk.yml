name: Build SolatKini Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Version & Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo dengan sejarah commit penuh
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Kira Versi (cth: 208 -> 2.0.8) & Jana Release Notes
      - name: 2. Kira Versi & Sediakan Release Notes
        id: versioning
        run: |
          TOTAL_COMMITS=$(git rev-list --count HEAD)
          
          if [ "$TOTAL_COMMITS" -ge 100 ]; then
            APP_VERSION=$(echo "$TOTAL_COMMITS" | sed 's/\(.\)\(.\)\(.*\)/\1.\2.\3/')
          else
            APP_VERSION="2.0.${TOTAL_COMMITS}"
          fi
          
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$TOTAL_COMMITS" >> $GITHUB_ENV
          echo "Versi APK Dijana: v$APP_VERSION (Build Code: $TOTAL_COMMITS)"

          echo "### 📱 SolatKini Malaysia v${APP_VERSION}" > release_notes.md
          echo "Binaan automatik untuk commit build #${TOTAL_COMMITS}." >> release_notes.md
          echo "" >> release_notes.md
          echo "#### ✨ Perubahan Terkini:" >> release_notes.md
          git log -10 --pretty=format:"* %s (%h)" >> release_notes.md
          echo "" >> release_notes.md

      # 3. Setup Node.js 22 (Capacitor 7 ke atas wajibkan Node >=22.0.0)
      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Java JDK 21
      - name: 4. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 5. Pasang dependensi
      - name: 5. Pasang Dependensi Projek
        run: |
          npm install --legacy-peer-deps

      # 6. Build Web Assets
      - name: 6. Build Web Assets (Vite)
        run: npm run build

      # 7. Sediakan Platform Android Capacitor
      - name: 7. Sediakan Platform Android Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 8. Suntik versi ke build.gradle
      - name: 8. Kemas Kini Versi dalam Gradle
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Mengemas kini versi ke $APP_VERSION (code: $VERSION_CODE)..."
            sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/g" "$GRADLE_FILE"
            sed -i "s/versionName \".*\"/versionName \"$APP_VERSION\"/g" "$GRADLE_FILE"
          fi

      # 9. Buang adaptive icon lama dan salin pek ikon SolatKini
      - name: 9. Salin Ikon Aplikasi Baharu
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -d "public/res" ]; then
            echo "Menyalin ikon dari public/res/..."
            cp -r public/res/* android/app/src/main/res/
          elif [ -d "res" ]; then
            echo "Menyalin ikon dari res/..."
            cp -r res/* android/app/src/main/res/
          fi

      # 10. Beri kebenaran gradlew
      - name: 10. Beri Kebenaran Gradlew
        run: |
          cd android
          chmod +x gradlew

      # 11. Compile Release APK
      - name: 11. Compile Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 12. Zipalign & Tandatangan APK
      - name: 12. Zipalign & Sign APK
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Build-Tools Digunakan: $BUILD_TOOLS"

          UNSIGNED_APK=$(find $APK_DIR -name "*unsigned.apk" -o -name "*-release.apk" | head -n 1)

          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$APK_DIR/aligned.apk"

          FINAL_APK_NAME="SolatKini-v${APP_VERSION}-signed.apk"

          $BUILD_TOOLS/apksigner sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$APK_DIR/$FINAL_APK_NAME" \
            "$APK_DIR/aligned.apk"

          $BUILD_TOOLS/apksigner verify --verbose "$APK_DIR/$FINAL_APK_NAME"

          echo "SIGNED_APK_PATH=$APK_DIR/$FINAL_APK_NAME" >> $GITHUB_ENV
          rm -f release.keystore "$APK_DIR/aligned.apk"

      # 13. Muat Naik ke GitHub Releases
      - name: 13. Cipta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SolatKini Release v${{ env.APP_VERSION }}"
          body_path: release_notes.md
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 14. Simpan ke Actions Artifacts
      - name: 14. Simpan ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolatKini-v${{ env.APP_VERSION }}-APK
          path: ${{ env.SIGNED_APK_PATH }}
          retention-days: 14
