name: Build SolatKini Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil kod projek dari repo
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup Node.js v22 (Memenuhi syarat Capacitor 8)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Pasang dependency & segerakkan kod ke folder android
      - name: Install Dependencies & Build Web
        run: |
          npm ci --legacy-peer-deps || npm install
          npm run build
          npx cap sync android

      # 4. Setup Java 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # 5. Compile fail APK Release guna Gradle (menggunakan Android SDK terbina pelayan GitHub)
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 6. Tandatangan (Sign) APK menggunakan Keystore dari GitHub Secrets
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 7. Muat naik fail APK yang telah siap ditandatangani ke Artifacts
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SolatKini-Signed-Release-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 14
