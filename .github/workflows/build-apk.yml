name: Build SolatKini Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Kod Sumber
        uses: actions/checkout@v4

      - name: 2. Sediakan Persekitaran Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Sediakan Persekitaran Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Sediakan Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Pasang Kebergantungan NPM
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 6. Bina Aplikasi Web (Vite Build)
        run: |
          npm run build

      - name: 7. Sinkronisasikan Kod ke Projek Android (Capacitor Sync)
        run: |
          npx cap sync android

      - name: 8. Berikan Kebenaran Perlaksanaan Gradle
        run: |
          cd android
          chmod +x ./gradlew

      - name: 9. Kompil Fail APK Android (Gradle Assemble Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Muat Naik Fail APK Sebagai Artifak GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SolatKini-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
