name: Build SolatKini Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Kod Sumber
        uses: actions/checkout@v4

      - name: 2. Sediakan Persekitaran Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Pasang Kebergantungan NPM
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: 4. Bina Aplikasi Web & Jana Ikon Android
        run: |
          npm run build
          node scripts/generate-android-icons.js

      - name: 5. Sinkronisasi Kod ke Projek Android (Capacitor Sync)
        run: |
          npx cap sync android

      - name: 6. Sediakan Persekitaran Java JDK 21 (Diperlukan oleh Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 7. Terima Lesen Android SDK Secara Automatik
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 8. Berikan Kebenaran Perlaksanaan Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 9. Kompil Fail APK Android (Gradle Assemble Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Muat Naik Fail APK Sebagai Artifak GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SolatKini-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
