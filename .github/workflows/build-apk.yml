name: Build SolatKini Kotlin Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build, Sign & Publish Kotlin Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Kira Versi & Sediakan Release Notes
        id: versioning
        run: |
          TOTAL_COMMITS=$(git rev-list --count HEAD)

          if [ "$TOTAL_COMMITS" -ge 100 ]; then
            APP_VERSION=$(echo "$TOTAL_COMMITS" | sed 's/\(.\)\(.\)\(.*\)/\1.\2.\3/')
          else
            APP_VERSION="2.0.${TOTAL_COMMITS}"
          fi

          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$TOTAL_COMMITS" >> $GITHUB_ENV
          echo "Versi APK Dijana: v$APP_VERSION (Build Code: $TOTAL_COMMITS)"

          echo "### SolatKini Malaysia v${APP_VERSION}" > release_notes.md
          echo "Binaan automatik Kotlin + Jetpack Compose untuk build #${TOTAL_COMMITS}." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Perubahan Terkini:" >> release_notes.md
          git log -10 --pretty=format:"* %s (%h)" >> release_notes.md
          echo "" >> release_notes.md

      - name: 3. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Setup Android SDK & Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            mkdir -p "$SDK_ROOT/licenses"
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: 5. Sediakan Gradle Wrapper & Suntik Versi ke app/build.gradle.kts
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

          GRADLE_KTS="app/build.gradle.kts"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/g" "$GRADLE_KTS"
            sed -i "s/versionName = \".*\"/versionName = \"$APP_VERSION\"/g" "$GRADLE_KTS"
          fi

      - name: 6. Compile Kotlin Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 7. Zipalign & Tandatangan APK
        run: |
          APK_DIR="app/build/outputs/apk/release"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          echo "Build-Tools Digunakan: $BUILD_TOOLS"

          UNSIGNED_APK=$(find "$APK_DIR" -name "*-unsigned.apk" -o -name "*-release.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Tiada APK release dijumpai dalam $APK_DIR"
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$APK_DIR/aligned.apk"

          FINAL_APK_NAME="SolatKini-v${APP_VERSION}-signed.apk"

          "$BUILD_TOOLS/apksigner" sign --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out "$APK_DIR/$FINAL_APK_NAME" \
            "$APK_DIR/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_DIR/$FINAL_APK_NAME"

          echo "SIGNED_APK_PATH=$APK_DIR/$FINAL_APK_NAME" >> $GITHUB_ENV
          rm -f release.keystore "$APK_DIR/aligned.apk"

      - name: 8. Cipta GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          name: "SolatKini Release v${{ env.APP_VERSION }}"
          body_path: release_notes.md
          files: ${{ env.SIGNED_APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 9. Kemaskini & Push version.json ke Repo
        run: |
          python3 -c '
import json, os, subprocess

latest_msg = subprocess.check_output(
    ["git", "log", "-1", "--pretty=%s"], text=True
).strip()
app_ver = os.environ["APP_VERSION"]
ver_code = int(os.environ["VERSION_CODE"])
repo = os.environ["GITHUB_REPOSITORY"]

payload = {
    "latestVersion": app_ver,
    "versionCode": ver_code,
    "releaseNotes": latest_msg or f"Kemaskini baharu SolatKini Malaysia v{app_ver}",
    "downloadUrl": f"https://github.com/{repo}/releases/download/v{app_ver}/SolatKini-v{app_ver}-signed.apk"
}

with open("version.json", "w", encoding="utf-8") as f:
    json.dump(payload, f, indent=2)
    f.write("\n")

print(json.dumps(payload, indent=2))
'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: kemaskini version.json ke v${APP_VERSION} (build ${VERSION_CODE}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 10. Simpan ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SolatKini-v${{ env.APP_VERSION }}-APK
          path: ${{ env.SIGNED_APK_PATH }}
          retention-days: 14
